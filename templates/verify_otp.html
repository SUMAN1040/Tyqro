{% extends 'base.html' %}

{% block title %}Verify Email | Tyqro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-glass border-0 shadow-lg p-4">
            <div class="card-body">
                <h2 class="text-center fw-bold mb-3">Check your inbox</h2>
                <p class="text-center text-muted small mb-4">We've sent a 6-digit verification code to <br/><strong>{{ email }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold ls-widest" placeholder="• • • • • •" maxlength="6" autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-medium">Verify Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
