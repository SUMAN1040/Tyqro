{% extends 'base.html' %}

{% block layout %}
<div class="auth-wrapper position-relative overflow-hidden min-vh-100 d-flex align-items-center justify-content-center">
    <!-- Animated Gradient Background -->
    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <!-- Content Container -->
    <div class="container position-relative z-1 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card border-secondary border-opacity-25 shadow-lg p-2 p-sm-4 rounded-4 auth-glass">
                    <div class="card-body">
                        <!-- Branding back button -->
                        <div class="text-center mb-4">
                            <a href="/" class="text-decoration-none text-white fs-3 fw-bold d-inline-flex align-items-center gap-2 mb-2">
                                <img src="/static/img/favicon.png" alt="Tyqro Logo" style="height: 32px; width: auto; object-fit: contain;"> Tyqro.
                            </a>
                        </div>
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert {% if message.tags == 'error' %}alert-danger bg-danger text-danger{% else %}alert-{{ message.tags|default:"info" }} bg-info text-info{% endif %} alert-dismissible fade show text-center py-2 px-3 small mb-3 border-0 bg-opacity-25" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close {% if message.tags == 'error' or message.tags == 'danger' %}btn-close-white{% endif %} py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        {% block auth_content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Animated Background Styles */
.auth-wrapper {
    background: #0b0f19; /* Deep dark base */
}
.animated-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
}
.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.6;
    animation: float 20s infinite alternate ease-in-out;
}
.blob-1 {
    top: -20%; left: -10%;
    width: 60vw; height: 60vw;
    background: #4facfe;
    animation-delay: 0s;
}
.blob-2 {
    bottom: -30%; right: -10%;
    width: 50vw; height: 50vw;
    background: #00f2fe;
    animation-delay: -5s;
    animation-direction: alternate-reverse;
}
.blob-3 {
    top: 20%; left: 20%;
    width: 40vw; height: 40vw;
    background: #667eea;
    animation-delay: -10s;
}

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(5%, 10%) scale(1.05); }
    66% { transform: translate(-5%, 5%) scale(0.95); }
    100% { transform: translate(0, -10%) scale(1.1); }
}

/* Glassmorphism Card */
.auth-glass {
    background: rgba(30, 33, 40, 0.6) !important;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
}

/* Enhancing forms inside auth-glass */
.auth-glass .form-control {
    background: rgba(0, 0, 0, 0.2) !important;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white !important;
}
.auth-glass .form-control:focus {
    background: rgba(0, 0, 0, 0.3) !important;
    border-color: #4facfe;
    box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25);
}
</style>
{% endblock %}

{% block footer %}{% endblock %} <!-- Hide the public footer on auth pages -->
