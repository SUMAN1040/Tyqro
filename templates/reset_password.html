{% extends 'auth_base.html' %}

{% block title %}Tyqro | Set New Password{% endblock %}

{% block auth_content %}
<h3 class="text-center fw-bold text-white mb-3">Set New Password</h3>
<p class="text-secondary small text-center mb-4">Your new password must be at least 8 characters long.</p>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label text-secondary small fw-medium" for="password">New Password</label>
        <div class="input-group">
            <input type="password" name="password" id="password" class="form-control" required minlength="8">
            <button class="btn btn-outline-secondary toggle-password-btn" type="button">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>
    <div class="mb-4">
        <label class="form-label text-secondary small fw-medium" for="confirm_password">Confirm Password</label>
        <div class="input-group">
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required minlength="8">
            <button class="btn btn-outline-secondary toggle-password-btn" type="button">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>
    <button type="submit" class="btn btn-primary text-dark w-100 py-2.5 rounded-3 fw-bold shadow-sm border-0" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">Save Password</button>
</form>
{% endblock %}
