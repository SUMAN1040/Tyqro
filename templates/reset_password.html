{% extends 'base.html' %}
{% block title %}Tyqro | Set New Password{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-glass border-0 shadow-lg p-4">
            <div class="card-body">
                <h3 class="text-center fw-bold mb-3">Set New Password</h3>
                <p class="text-muted small text-center mb-4">Your new password must be at least 8 characters long.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small" for="password">New Password</label>
                        <input type="password" name="password" id="password" class="form-control bg-dark border-secondary text-light" required minlength="8">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small" for="confirm_password">Confirm Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control bg-dark border-secondary text-light" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-medium">Save Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
