{% extends 'base.html' %}
{% block title %}Tyqro | Verify Code{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-glass border-0 shadow-lg p-4">
            <div class="card-body">
                <h3 class="text-center fw-bold mb-3">Check your email</h3>
                <p class="text-muted small text-center mb-4">We've sent a 6-digit verification code to <strong>{{ email }}</strong>.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small" for="otp">Verification Code</label>
                        <input type="text" name="otp" id="otp" class="form-control bg-dark border-secondary text-light text-center fs-4 letter-spacing-2" maxlength="6" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 rounded-3 fw-medium">Verify Code</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
