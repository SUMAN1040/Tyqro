{% extends 'auth_base.html' %}

{% block title %}Tyqro | Verify Code{% endblock %}

{% block auth_content %}
<h3 class="text-center fw-bold text-white mb-3">Check your email</h3>
<p class="text-secondary small text-center mb-4">We've sent a 6-digit verification code to <strong class="text-light">{{ email }}</strong>.</p>
<form method="post">
    {% csrf_token %}
    <div class="mb-4">
        <label class="form-label text-secondary small fw-medium text-center d-block w-100" for="otp">Verification Code</label>
        <input type="text" name="otp" id="otp" class="form-control bg-dark bg-opacity-50 border-secondary border-opacity-50 text-white text-center fs-3 py-2" maxlength="6" required autocomplete="off" style="letter-spacing: 0.5em; font-family: monospace;">
    </div>
    <button type="submit" class="btn btn-primary text-dark w-100 py-2.5 mt-2 rounded-3 fw-bold shadow-sm border-0" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">Verify Code</button>
</form>
{% endblock %}
