{% extends 'base.html' %}

{% block title %}WorkLog | Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-glass border-0 shadow-lg p-4">
            <div class="card-body">
                <h2 class="text-center fw-bold mb-4">Welcome back</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-muted small">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 rounded-3 fw-medium">Log In</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted small">Don't have an account? <a href="{% url 'signup' %}" class="text-primary text-decoration-none">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
