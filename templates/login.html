{% extends 'auth_base.html' %}

{% block title %}Tyqro | Login{% endblock %}

{% block auth_content %}
<h3 class="text-center fw-bold text-white mb-4">Welcome back</h3>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label text-secondary small fw-medium">{{ field.label }}</label>
        {{ field }}
    </div>
    {% endfor %}
    <div class="text-end mb-3">
        <a href="{% url 'forgot_password' %}" class="text-info text-decoration-none small hover-opacity">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 rounded-3 fw-medium shadow-sm border-0" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">Log In</button>
</form>
<div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
    <p class="text-secondary small mb-0">Don't have an account? <a href="{% url 'signup' %}" class="text-info fw-medium text-decoration-none hover-opacity">Sign up for free</a></p>
</div>

<style>
    .hover-opacity:hover { opacity: 0.8; transition: opacity 0.2s; }
</style>
{% endblock %}
