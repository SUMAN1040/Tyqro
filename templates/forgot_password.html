{% extends 'base.html' %}
{% block title %}Tyqro | Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-glass border-0 shadow-lg p-4">
            <div class="card-body">
                <h3 class="text-center fw-bold mb-3">Reset Password</h3>
                <p class="text-muted small text-center mb-4">Enter your registered email address and we'll send you a verification code.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small" for="email">Email address</label>
                        <input type="email" name="email" id="email" class="form-control bg-dark border-secondary text-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 rounded-3 fw-medium">Send Code</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted small">Remember your password? <a href="{% url 'login' %}" class="text-primary text-decoration-none">Log In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
