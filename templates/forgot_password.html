{% extends 'auth_base.html' %}

{% block title %}Tyqro | Forgot Password{% endblock %}

{% block auth_content %}
<h3 class="text-center fw-bold text-white mb-3">Reset Password</h3>
<p class="text-secondary small text-center mb-4">Enter your registered email address and we'll send you a verification code.</p>
<form method="post" hx-boost="true">
    {% csrf_token %}
    <div class="mb-4">
        <label class="form-label text-secondary small fw-medium" for="email">Email address</label>
        <input type="email" name="email" id="email" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary text-dark w-100 py-2.5 mt-2 rounded-3 fw-bold shadow-sm border-0" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">Send Verification Code</button>
</form>
<div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
    <p class="text-secondary small mb-0">Remember your password? <a href="{% url 'login' %}" class="text-info fw-medium text-decoration-none hover-opacity">Log In</a></p>
</div>

<style>
    .hover-opacity:hover { opacity: 0.8; transition: opacity 0.2s; }
</style>
{% endblock %}
