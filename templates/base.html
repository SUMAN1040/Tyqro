<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WorkLog | Simplify Your Day{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="WorkLog is a modern attendance and task management platform. Track your work hours, manage daily todos, and monitor performance seamlessly.">
    <meta name="keywords" content="attendance, task management, todo list, time tracking, productivity">
    <meta name="robots" content="index, follow">
    <meta name="author" content="WorkLog">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="WorkLog | Simplify Your Day">
    <meta property="og:description" content="Track your work hours, manage daily todos, and monitor performance seamlessly with WorkLog.">
    <meta property="og:site_name" content="WorkLog">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="d-flex flex-column min-vh-100" id="wrapper">
        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 flex-grow-1">
            {% if user.is_authenticated %}
            <nav class="navbar navbar-expand py-3 px-4 border-bottom border-secondary-subtle">
                <div class="container-fluid px-0 d-flex align-items-center justify-content-between">
                    <a class="navbar-brand fs-4 fw-bold text-body" href="{% url 'dashboard' %}">WorkLog.</a>
                    
                    <div class="ms-auto d-flex align-items-center">
                        <div class="dropdown me-3">
                            <button class="btn btn-link text-body text-decoration-none dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle fs-5"></i>
                                <span class="d-none d-md-inline">{{ user.first_name|default:user.username }}</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end border-0 shadow">
                                <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form action="{% url 'logout' %}" method="post" class="px-2 m-0">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item text-danger w-100"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                                    </form>
                                </li>
                            </ul>
                        </div>

                        <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="themeToggle"><i class="bi bi-moon-stars"></i></button>
                    </div>
                </div>
            </nav>
            {% endif %}

            <div class="container py-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global JS config
        const csrfToken = '{{ csrf_token }}';
    </script>
    <!-- Custom JS -->
    <script src="/static/js/main.js?v=6"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
