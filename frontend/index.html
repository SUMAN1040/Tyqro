<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Tyqro | Simplify Your Day</title>
    <meta name="title" content="Tyqro | Simplify Your Day" />
    <meta name="description" content="Tyqro is a premium personal productivity suite featuring precision time tracking, task management, and beautiful performance analytics. Boost your focus today!" />
    <meta name="keywords" content="productivity, time tracker, task manager, task board, dashboard, focus, work hours, analytics, developer tools, remote work, freelancer" />
    <meta name="author" content="Tyqro Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tyqro.vercel.app/" />
    <meta property="og:title" content="Tyqro | Simplify Your Day" />
    <meta property="og:description" content="Tyqro is a premium personal productivity suite featuring precision time tracking, task management, and beautiful performance analytics." />
    <meta property="og:image" content="https://tyqro.vercel.app/tyqro_mockup.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tyqro.vercel.app/" />
    <meta property="twitter:title" content="Tyqro | Simplify Your Day" />
    <meta property="twitter:description" content="Tyqro is a premium personal productivity suite featuring precision time tracking, task management, and beautiful performance analytics." />
    <meta property="twitter:image" content="https://tyqro.vercel.app/tyqro_mockup.png" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered with scope: ', reg.scope))
            .catch(err => console.error('Service Worker registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
